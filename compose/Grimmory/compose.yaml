services:
  grimmory-db:
    image: lscr.io/linuxserver/mariadb:11.4.5
    container_name: GrimmoryMariaDB
    restart: unless-stopped

    environment:
      PUID: ${DB_USER_ID}
      PGID: ${DB_GROUP_ID}
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ${APPDATA}/mariadb:/config

    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - grimmory-net


  grimmory:
    image: ghcr.io/grimmory-tools/grimmory:latest
    container_name: Grimmory
    restart: unless-stopped

    depends_on:
      grimmory-db:
        condition: service_healthy

    environment:
      USER_ID: ${APP_USER_ID}
      GROUP_ID: ${APP_GROUP_ID}
      TZ: ${TZ}
      DATABASE_URL: jdbc:mariadb://grimmory-db:3306/${MYSQL_DATABASE}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED}
      DISK_TYPE: ${DISK_TYPE}

    ports:
      - "6060:6060"
  
  volumes:
    - ${APPDATA}/data:/app/data
    - ${BOOKDROP}:/bookdrop
    - ${CALIBRE_LIBRARY}:/books/calibre:ro
    - ${SECOND_LIBRARY}:/books/calibre2:ro
    - ${MAIN_LIBRARY}:/books/main
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6060/api/v1/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - grimmory-net


networks:
  grimmory-net:
    driver: bridge
