name: bookorbit

services:
  app:
    container_name: bookorbit-app
    image: ${APP_IMAGE:-ghcr.io/bookorbit/bookorbit:latest}
    restart: unless-stopped
    init: true

    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"

    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}

      DATABASE_URL: ${DATABASE_URL:-}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-bookorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bookorbit}

      JWT_SECRET: ${JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${PODCAST_ENCRYPTION_KEY:-}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN}

      APP_URL: ${APP_URL}
      CLIENT_URL: ${CLIENT_URL:-${APP_URL}}

      TZ: ${TZ:-Europe/Madrid}

      PUID: ${PUID:-500}
      PGID: ${PGID:-500}

      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-2048}

      BOOK_DOCK_PATH: ${BOOK_DOCK_PATH:-}
      LIBRARY_BROWSE_ROOT: ${LIBRARY_BROWSE_ROOT:-/}

      DISABLE_LOCAL_AUTH: ${DISABLE_LOCAL_AUTH:-false}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ${BOOKS_HOST_PATH}:/books
      - ${COMICS_HOST_PATH}:/comics
      - ${APP_DATA_PATH}:/data

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

  postgres:
    container_name: bookorbit-db
    image: pgvector/pgvector:pg18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bookorbit}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
