
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: Homarr
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}

    ports:
      - "7575:7575"

    volumes:
      - ${APPDATA}:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
